name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Muat konfigurasi dari build.env
        run: grep -vE '^\s*(#|$)' build.env >> "$GITHUB_ENV"

      - name: Pasang google-services.json dari Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON belum diisi. Lihat README.md bagian Setup Firebase langkah 5."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Pasang logo ikon dari build.env
        run: cp "$LOGO_FOREGROUND" app/src/main/res/drawable-nodpi/ic_launcher_foreground.png

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-${{ env.ANDROID_PLATFORM }} build-tools;${{ env.BUILD_TOOLS_VERSION }}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build APK debug
        run: gradle --console=plain assembleDebug

      - name: Ganti nama APK
        run: |
          mkdir -p dist
          APK_FILE="$(printf '%s' "${APP_NAME}-${VERSION_NAME}" | tr ' ' '_')"
          echo "APK_FILE=${APK_FILE}" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${APK_FILE}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILE }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Buat GitHub Release (hanya untuk tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
